name: Deploy releases

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/releases/**"
      - "packages/theme/**"
      - ".github/scripts/sync-releases.mjs"
      - ".github/scripts/discover-repos.mjs"
      - ".github/scripts/announce-releases.mjs"
      - ".github/scripts/generate-search-embeddings.mjs"
      - ".github/workflows/deploy-releases.yml"

concurrency:
  group: deploy-releases
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Sync release notes
        id: sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: bb37de82a8d1040e9945ead5a03bab8d
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node .github/scripts/sync-releases.mjs
          # Non-fatal: a failed discovery pass only delays the next enrollment ask.
          node .github/scripts/discover-repos.mjs \
            || echo "::warning::discover-repos.mjs failed - keeping the previous enrollment.json"
          # Non-fatal on purpose: a Workers AI hiccup (auth, rate limit,
          # model outage) should never block syncing/deploying real release
          # content - search falls back to stale-but-present embeddings,
          # which is a far better failure mode than every scheduled sync
          # run failing outright until someone notices and fixes it.
          node .github/scripts/generate-search-embeddings.mjs releases \
            || echo "::warning::generate-search-embeddings.mjs failed - continuing with existing embeddings"
          if [ -n "$(git status --porcelain apps/releases/src/content/releases apps/releases/public/search-embeddings.json apps/releases/public/enrollment.json)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      # NOTE: pushes with the default GITHUB_TOKEN. If branch protection is ever
      # added to `main` requiring PR review, this push will start failing silently
      # on schedule runs - switch to a PAT secret or a side-branch+auto-merge then.
      - name: Commit synced releases
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name "rpgm-press-bot"
          git config user.email "press-bot@users.noreply.github.com"
          git add apps/releases/src/content/releases apps/releases/public/search-embeddings.json apps/releases/public/enrollment.json
          git commit -m "chore: sync release notes"
          git push

  deploy:
    needs: sync
    if: needs.sync.outputs.changed == 'true' || github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter releases build
        env:
          PUBLIC_CF_BEACON_TOKEN: ${{ secrets.CF_BEACON_TOKEN_RELEASES }}
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: apps/releases
          command: deploy
      # Runs after the deploy so the Ledger link in each post already resolves.
      - name: Announce new releases on Discord
        env:
          DISCORD_WEBHOOK_NEO_ANGBAND: ${{ secrets.DISCORD_WEBHOOK_NEO_ANGBAND }}
          DISCORD_WEBHOOK_RPGM_TOOLS: ${{ secrets.DISCORD_WEBHOOK_RPGM_TOOLS }}
          DISCORD_WEBHOOK_OTHER_PROJECTS: ${{ secrets.DISCORD_WEBHOOK_OTHER_PROJECTS }}
          DISCORD_NEO_ANGBAND_RELEASE_TAG_ID: ${{ vars.DISCORD_NEO_ANGBAND_RELEASE_TAG_ID }}
          DISCORD_NEO_ANGBAND_ROLE_ID: ${{ vars.DISCORD_NEO_ANGBAND_ROLE_ID }}
          DISCORD_NEO_ANGBAND_MODE: ${{ vars.DISCORD_NEO_ANGBAND_MODE }}
          DISCORD_RPGM_TOOLS_RELEASE_TAG_ID: ${{ vars.DISCORD_RPGM_TOOLS_RELEASE_TAG_ID }}
          DISCORD_RPGM_TOOLS_ROLE_ID: ${{ vars.DISCORD_RPGM_TOOLS_ROLE_ID }}
          DISCORD_RPGM_TOOLS_MODE: ${{ vars.DISCORD_RPGM_TOOLS_MODE }}
          DISCORD_OTHER_PROJECTS_RELEASE_TAG_ID: ${{ vars.DISCORD_OTHER_PROJECTS_RELEASE_TAG_ID }}
          DISCORD_OTHER_PROJECTS_ROLE_ID: ${{ vars.DISCORD_OTHER_PROJECTS_ROLE_ID }}
          DISCORD_OTHER_PROJECTS_MODE: ${{ vars.DISCORD_OTHER_PROJECTS_MODE }}
        run: |
          node .github/scripts/announce-releases.mjs
          if [ -n "$(git status --porcelain apps/releases/announced.json)" ]; then
            git config user.name "rpgm-press-bot"
            git config user.email "press-bot@users.noreply.github.com"
            git add apps/releases/announced.json
            git commit -m "chore: record announced releases"
            git pull --rebase
            git push
          fi
