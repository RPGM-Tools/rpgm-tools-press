name: Deploy blog

on:
  push:
    branches: [main]
    paths:
      - "apps/blog/**"
      - "packages/theme/**"
      - ".github/scripts/generate-search-embeddings.mjs"
      - ".github/workflows/deploy-blog.yml"
  workflow_dispatch:
    inputs:
      announce:
        description: Post file to announce in the Discord #blog forum (for example apps/blog/src/content/posts/my-post.md)
        required: false
        default: ""

concurrency:
  group: deploy-blog
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Refresh semantic-search embeddings
        # Non-fatal on purpose: a Workers AI hiccup (auth, rate limit, model
        # outage) should never block deploying otherwise-working code -
        # search falls back to stale-but-present embeddings, which is a far
        # better failure mode than the whole site failing to deploy.
        continue-on-error: true
        env:
          CLOUDFLARE_ACCOUNT_ID: bb37de82a8d1040e9945ead5a03bab8d
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node .github/scripts/generate-search-embeddings.mjs blog
      - run: pnpm --filter blog build
        env:
          PUBLIC_CF_BEACON_TOKEN: ${{ secrets.CF_BEACON_TOKEN_BLOG }}
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: apps/blog
          command: deploy
      - name: Announce new posts on Discord
        if: github.event_name == 'push' || inputs.announce != ''
        env:
          DISCORD_BLOG_WEBHOOK_URL: ${{ secrets.DISCORD_BLOG_WEBHOOK_URL }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          ANNOUNCE: ${{ inputs.announce }}
        run: |
          if [ -n "$ANNOUNCE" ]; then
            node .github/scripts/announce-blog-posts.mjs --file "$ANNOUNCE"
          else
            node .github/scripts/announce-blog-posts.mjs "$BEFORE" "$AFTER"
          fi
